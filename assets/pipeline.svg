<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="210" viewBox="0 0 1120 210" role="img" aria-labelledby="title desc">
  <title id="title">Visual object search pipeline</title>
  <desc id="desc">Query image becomes SIFT descriptors, is encoded with 4000 visual words, retrieves 600 candidates using TF-IDF, verifies them with SIFT matching and RANSAC, then ranks the results.</desc>
  <rect width="1120" height="210" rx="20" fill="#0f172a"/>
  <text x="32" y="37" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">TWO-STAGE IMAGE RETRIEVAL</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="26" y="66" width="146" height="95" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="99" y="107" fill="#f8fafc" font-size="17" font-weight="700">Query image</text>
    <text x="99" y="134" fill="#94a3b8" font-size="14">object photo</text>
    <rect x="208" y="66" width="146" height="95" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="281" y="107" fill="#f8fafc" font-size="17" font-weight="700">SIFT</text>
    <text x="281" y="134" fill="#94a3b8" font-size="14">local features</text>
    <rect x="390" y="66" width="146" height="95" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="463" y="107" fill="#f8fafc" font-size="17" font-weight="700">Visual words</text>
    <text x="463" y="134" fill="#94a3b8" font-size="14">4,000-word codebook</text>
    <rect x="572" y="66" width="146" height="95" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="645" y="107" fill="#f8fafc" font-size="17" font-weight="700">TF-IDF</text>
    <text x="645" y="134" fill="#c4b5fd" font-size="14">top 600 candidates</text>
    <rect x="754" y="66" width="146" height="95" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="827" y="107" fill="#f8fafc" font-size="17" font-weight="700">Verify</text>
    <text x="827" y="134" fill="#a7f3d0" font-size="14">matching + RANSAC</text>
    <rect x="936" y="66" width="158" height="95" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="1015" y="107" fill="#f8fafc" font-size="17" font-weight="700">Ranked matches</text>
    <text x="1015" y="134" fill="#a7f3d0" font-size="14">top four in GUI</text>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 113h18m-6-6 6 6-6 6 M362 113h18m-6-6 6 6-6 6 M544 113h18m-6-6 6 6-6 6 M726 113h18m-6-6 6 6-6 6 M908 113h18m-6-6 6 6-6 6"/>
  </g>
</svg>
